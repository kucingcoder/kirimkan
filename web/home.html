<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirimkan</title>
    <link rel="icon" type="image/x-icon" href="/static/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <nav class="bg-white shadow-md p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <!-- Logo -->
            <div>
                <a href="/" class="flex items-center justify-center space-x-2">
                    <img src="/static/logo.png" alt="Logo" class="w-6 h-6">
                    <p class="font-bold text-gray-700 text-xl">Kirimkan</p>
                </a>
            </div>

            <!-- Desktop Menu -->
            <ul class="hidden md:flex text-gray-700">
                <li class="flex items-center gap-4">
                    <a href="/login" class="text-gray-700 hover:text-blue-500 hover:underline font-bold">Login</a>
                    <a href="/register" class="text-gray-700 hover:text-blue-500 hover:underline font-bold">Register</a>
                </li>
            </ul>

            <!-- Hamburger Button for Mobile -->
            <button id="menu-btn" class="md:hidden text-gray-700 text-2xl">
                ☰
            </button>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu"
            class="hidden md:hidden flex flex-col space-y-4 p-4 bg-white absolute top-16 right-0 w-full">
            <a href="/login" class="text-gray-700 hover:text-blue-500 hover:underline font-bold">Login</a>
            <a href="/register" class="text-gray-700 hover:text-blue-500 hover:underline font-bold">Register</a>
        </div>
    </nav>

    <section id="overview" class="relative h-screen w-full bg-center bg-cover"
        style="background-image: url('/static/background.webp');">
        <div class="absolute inset-0 bg-black bg-opacity-60"></div>
        <div class="relative h-full flex flex-col justify-center mx-8 md:mx-16">
            <h1 class="text-4xl font-bold text-white">Kirimkan</h1>
            <p class="text-xl text-white text-justify mt-4 md:max-w-xl">
                An open-source software to send WhatsApp messages through a completely free and unlimited API, using
                your own number. Kirimkan is a self-hosted solution that allows you to send messages without any limitations.
            </p>
            <a href="https://github.com/kucingcoder/kirimkan" target="_blank"
                class="mt-4 w-fit flex items-center p-2 bg-blue-500 text-white font-bold rounded text-lg hover:bg-blue-600 border-2 border-white active:scale-95 transition">
                <svg class="w-6 h-6 me-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor"
                    viewBox="0 0 20 20">
                    <path fill-rule="evenodd"
                        d="M10 .333A9.911 9.911 0 0 0 6.866 19.65c.5.092.678-.215.678-.477 0-.237-.01-1.017-.014-1.845-2.757.6-3.338-1.169-3.338-1.169a2.627 2.627 0 0 0-1.1-1.451c-.9-.615.07-.6.07-.6a2.084 2.084 0 0 1 1.518 1.021 2.11 2.11 0 0 0 2.884.823c.044-.503.268-.973.63-1.325-2.2-.25-4.516-1.1-4.516-4.9A3.832 3.832 0 0 1 4.7 7.068a3.56 3.56 0 0 1 .095-2.623s.832-.266 2.726 1.016a9.409 9.409 0 0 1 4.962 0c1.89-1.282 2.717-1.016 2.717-1.016.366.83.402 1.768.1 2.623a3.827 3.827 0 0 1 1.02 2.659c0 3.807-2.319 4.644-4.525 4.889a2.366 2.366 0 0 1 .673 1.834c0 1.326-.012 2.394-.012 2.72 0 .263.18.572.681.475A9.911 9.911 0 0 0 10 .333Z"
                        clip-rule="evenodd" />
                </svg>
                Github
            </a>
        </div>
    </section>

    <script>
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
        }

        document.addEventListener("DOMContentLoaded", function () {
            let dropdown = document.querySelector(".group");
            let menu = dropdown.querySelector("ul");

            let timeout;

            dropdown.addEventListener("mouseenter", function () {
                clearTimeout(timeout);
                menu.style.display = "block";
            });

            dropdown.addEventListener("mouseleave", function () {
                timeout = setTimeout(() => { menu.style.display = "none"; }, 300);
            });
        }
        );

        const menuBtn = document.getElementById("menu-btn");
        const mobileMenu = document.getElementById("mobile-menu");
        const mobileDocsBtn = document.getElementById("mobile-docs-btn");
        const mobileDocsMenu = document.getElementById("mobile-docs-menu");

        menuBtn.addEventListener("click", () => {
            mobileMenu.classList.toggle("hidden");
        });

        mobileDocsBtn?.addEventListener("click", () => {
            mobileDocsMenu?.classList.toggle("hidden");
        });
    </script>
</body>

</html>
