<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirimkan</title>
    <link rel="icon" type="image/x-icon" href="/static/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <nav class="bg-white shadow-md p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <!-- Logo -->
            <div>
                <a href="/" class="flex items-center justify-center space-x-2">
                    <img src="/static/logo.png" alt="Logo" class="w-6 h-6">
                    <p class="font-bold text-gray-700 text-xl">Kirimkan</p>
                </a>
            </div>

            <!-- Desktop Menu -->
            <ul class="hidden md:flex text-gray-700">
                <li class="flex items-center gap-4">
                    <a href="/login" class="text-gray-700 hover:text-blue-500 hover:underline font-bold">Login</a>
                    <a href="/register" class="text-gray-700 hover:text-blue-500 hover:underline font-bold">Register</a>
                </li>
            </ul>

            <!-- Hamburger Button for Mobile -->
            <button id="menu-btn" class="md:hidden text-gray-700 text-2xl">
                ☰
            </button>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu"
            class="hidden md:hidden flex flex-col space-y-4 p-4 bg-white absolute top-16 right-0 w-full">
            <a href="/login" class="text-gray-700 hover:text-blue-500 hover:underline font-bold">Login</a>
            <a href="/register" class="text-gray-700 hover:text-blue-500 hover:underline font-bold">Register</a>
        </div>
    </nav>

    <div class="flex items-center justify-center min-h-screen bg-gray-100">
        <div class="w-full max-w-sm p-6 bg-white rounded-2xl shadow-lg">
            <h2 class="text-2xl font-bold text-center mb-6">Login</h2>
            <form action="/login" method="POST" class="space-y-5">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" name="username" id="username" required
                        class="mt-1 block w-full rounded-lg border-2 border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50 p-2">
                </div>
        
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" name="password" id="password" required
                        class="mt-1 block w-full rounded-lg border-2 border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50 p-2">
                </div>
        
                <div>
                    <button type="submit"
                        class="w-full bg-blue-600 text-white rounded-lg p-2 hover:bg-blue-700 transition duration-300 font-semibold">
                        Login
                    </button>
                </div>

                {{if .Error}}
                <div class="text-red-500 text-sm text-center mt-2">{{.Error}}</div>
                {{end}}
            </form>
        </div>
    </div>

    <script>
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
        }

        document.addEventListener("DOMContentLoaded", function () {
            let dropdown = document.querySelector(".group");
            let menu = dropdown.querySelector("ul");

            let timeout;

            dropdown.addEventListener("mouseenter", function () {
                clearTimeout(timeout);
                menu.style.display = "block";
            });

            dropdown.addEventListener("mouseleave", function () {
                timeout = setTimeout(() => { menu.style.display = "none"; }, 300);
            });
        }
        );

        const menuBtn = document.getElementById("menu-btn");
        const mobileMenu = document.getElementById("mobile-menu");
        const mobileDocsBtn = document.getElementById("mobile-docs-btn");
        const mobileDocsMenu = document.getElementById("mobile-docs-menu");

        menuBtn.addEventListener("click", () => {
            mobileMenu.classList.toggle("hidden");
        });

        mobileDocsBtn?.addEventListener("click", () => {
            mobileDocsMenu?.classList.toggle("hidden");
        });
    </script>
</body>

</html>
